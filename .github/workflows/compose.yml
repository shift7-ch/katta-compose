name: Compose

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

jobs:
  up:
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [ local, demo ]
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Start ${{ matrix.profile }} profile
        run: docker compose --env-file local.env --profile ${{ matrix.profile }} up --build --wait --wait-timeout 900
      - name: Show logs
        if: ${{ failure() }}
        run: docker compose --env-file local.env --profile ${{ matrix.profile }} logs --no-color
      - name: Stop
        if: ${{ always() }}
        run: docker compose --env-file local.env --profile ${{ matrix.profile }} down --volumes
