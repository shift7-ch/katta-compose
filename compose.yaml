services:
  # renders the realm from the Keycloak realm template of the Katta Server Helm chart
  keycloak-realm:
    profiles: [ local, demo ]
    image: alpine/helm:4.3.0
    entrypoint: [ "/bin/sh","-c" ]
    command:
      - |
        # no -x as the command line contains the admin password and client secrets
        set -euo pipefail

        apk add --no-cache yq-go
        helm template katta ${KATTA_CHART:-oci://ghcr.io/shift7-ch/katta-helm/katta-server} $${KATTA_CHART_VERSION:+--version "$$KATTA_CHART_VERSION"} \
          --show-only templates/keycloak-secret.yaml \
          --set-string urls.hub.public=${HUB_URL} \
          --set-string urls.kc.public=${HUB_KEYCLOAK_URL}${HUB_KEYCLOAK_BASEPATH} \
          --set-string hub.config.keycloakRealm=${HUB_KEYCLOAK_REALM} \
          --set-string keycloak.realmBootstrap.realmId=${HUB_KEYCLOAK_REALM} \
          --set-string hub.admin.username=${HUB_ADMIN_USER} \
          --set-string hub.admin.password=${HUB_ADMIN_PASSWORD} \
          --set hub.admin.passwordTemporary=false \
          --set-string hub.secrets.systemClientSecret=${HUB_KEYCLOAK_SYSTEM_CLIENT_SECRET} \
          --set-string hub.secrets.cryptomatorvaultsClientSecret=${HUB_KEYCLOAK_OIDC_CRYPTOMATOR_VAULTS_CLIENT_SECRET} \
          | yq '.stringData["realm.json"]' > /import/keycloak.json
        test -s /import/keycloak.json
    environment:
      KATTA_CHART_VERSION: ${KATTA_CHART_VERSION:-}
    volumes:
      - keycloak-import:/import

  keycloak:
    profiles: [ local, demo ]
    image: "ghcr.io/shift7-ch/keycloak:26.7.1"
    pull_policy: missing
    ports:
      - "${HUB_KEYCLOAK_HTTP_PORT:-1}:${HUB_KEYCLOAK_HTTP_PORT:-1}"
      - "${HUB_KEYCLOAK_HTTPS_PORT:-1}:8443"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      PROXY_ADDRESS_FORWARDING: "true"
      KEYCLOAK_LOGLEVEL: DEBUG
      DB_VENDOR: h2
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/dev/certs/keycloak-server.crt.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/dev/certs/keycloak-server.key.pem
    volumes:
      # realm rendered by keycloak-realm as keycloak.json because of https://github.com/keycloak/keycloak/issues/37569
      - keycloak-import:/opt/keycloak/data/import:ro
      - ./keycloak/certs:/opt/keycloak/dev/certs
    networks:
      default:
        # HUB_KEYCLOAK_URL resolves to this container inside the Docker network
        aliases: [ keycloak.localhost ]
    # requests to HUB_KEYCLOAK_URL inside the Docker network go to the container internal port! Therefore, we need to start keycloak with the same port as published on the host
    command: start-dev --import-realm --db=dev-mem --health-enabled=true --hostname ${HUB_KEYCLOAK_HOSTNAME} --http-port ${HUB_KEYCLOAK_HTTP_PORT}
    healthcheck:
      test: [ "CMD-SHELL", "curl -v --fail http://127.0.0.1:${HUB_KEYCLOAK_HTTP_PORT}/realms/${HUB_KEYCLOAK_REALM}/.well-known/openid-configuration" ]
      interval: 5s
      timeout: 10s
      retries: 15
    depends_on:
      keycloak-realm:
        condition: service_completed_successfully


  keycloak-allow-http:
    profiles: [ local, demo ]
    image: "ghcr.io/shift7-ch/keycloak:26.7.1"
    pull_policy: missing
    entrypoint: [ "/bin/bash","-c" ]
    command:
      - |
        set -euxo pipefail

        # fix for Docker Desktop 4.42.1 based on https://github.com/keycloak/keycloak/discussions/12155
        /opt/keycloak/bin/kcadm.sh update --server http://keycloak:${HUB_KEYCLOAK_HTTP_PORT} --realm master --user admin --password admin realms/master -s sslRequired=NONE
        /opt/keycloak/bin/kcadm.sh update --server http://keycloak:${HUB_KEYCLOAK_HTTP_PORT} --realm master --user admin --password admin realms/${HUB_KEYCLOAK_REALM} -s sslRequired=NONE

    depends_on:
      keycloak-ready:
        condition: service_completed_successfully

  keycloak-ready:
    profiles: [ local, demo, hybrid ]
    image: busybox:1.37
    entrypoint: [ "/bin/sh","-c" ]
    command:
      - |
        set -eux

        # no curl, as it resolves subdomains of localhost to the loopback address instead of the Keycloak container
        until wget -q -O /dev/null ${HUB_KEYCLOAK_URL}${HUB_KEYCLOAK_BASEPATH}/realms/${HUB_KEYCLOAK_REALM}/.well-known/openid-configuration; do sleep 1; done
    healthcheck:
      test: [ "CMD-SHELL", "exit 0" ]
      interval: 10s
      timeout: 1s
      retries: 15

  postgres:
    profiles: [ local, demo, hybrid ]
    image:
      docker.io/postgres:14
    environment:
      # extracted from running container started with mvn quarkus:dev
      - POSTGRES_USER=quarkus
      - POSTGRES_PASSWORD=quarkus
      - POSTGRES_DB=quarkus
      - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/lib/postgresql/14/bin
      - GOSU_VERSION=1.16
      - LANG=en_US.utf8
      - PG_MAJOR=14
      - PG_VERSION=14.7-1.pgdg110+1
      - PGDATA=/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U quarkus -d quarkus'" ]
      interval: 10s
      timeout: 3s
      retries: 3

  minio:
    profiles: [ local, demo ]
    build:
      context: ./minio
    depends_on:
      keycloak-ready:
        condition: service_completed_successfully
    restart: on-failure
    ports:
      - "${MINIO_PORT}:${MINIO_PORT}"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"
    networks:
      default:
        # endpoint URL of the storage profiles resolves to this container inside the Docker network
        aliases: [ minio.localhost ]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Restrict global CORS instead of using wildcard '*' default, see https://docs.min.io/enterprise/aistor-object-store/reference/aistor-server/settings/core/?tab=cors-allow-origin-configuration-setting
      # and https://github.com/minio/minio/blob/master/docs/config/README.md
      # CORS relevant when using Web frontend local for development, not when using Java client.
      # Note: per bucket CORS not supported in MinIO Community Edition: https://github.com/minio/minio/discussions/20841
      MINIO_API_CORS_ALLOW_ORIGIN: "${HUB_URL}"
    healthcheck:
      test: [ "CMD-SHELL", "curl -v --fail ${MINIO_SCHEME}://${MINIO_HOSTNAME}:${MINIO_PORT}/minio/health/ready" ]
      interval: 5s
      timeout: 5s
      retries: 5
    command: [ "server", "/data", "--address", ":${MINIO_PORT}", "--console-address", ":${MINIO_CONSOLE_PORT}" ]

  minio_setup:
    profiles: [ local, demo ]
    build:
      context: ./minio-setup
    depends_on:
      minio:
        condition: service_healthy
      keycloak-ready:
        condition: service_completed_successfully
    volumes:
      - ${SETUP_DIR:-./setup}:/setup
    entrypoint: [ "/bin/bash","-c" ]
    command:
      - |
        set -euxo pipefail

        ls /setup
        /mc alias set myminio ${MINIO_SCHEME}://minio:${MINIO_PORT} minioadmin minioadmin

        /mc admin policy create myminio katta-createbucketpolicy /setup/minio_sts/create_bucket_policy.json
        /mc admin policy create myminio katta-accessbucketpolicy /setup/minio_sts/access_bucket_policy.json


        /mc idp openid add myminio cryptomator \
          config_url="${HUB_KEYCLOAK_URL}${HUB_KEYCLOAK_BASEPATH}/realms/${HUB_KEYCLOAK_REALM}/.well-known/openid-configuration" \
          client_id="cryptomator" \
          client_secret="ignore-me" \
          role_policy="katta-createbucketpolicy" || echo "Could not add idp - probably already defined"
        /mc idp openid add myminio cryptomatorhub \
          config_url="${HUB_KEYCLOAK_URL}${HUB_KEYCLOAK_BASEPATH}/realms/${HUB_KEYCLOAK_REALM}/.well-known/openid-configuration" \
          client_id="cryptomatorhub" \
          client_secret="ignore-me" \
          role_policy="katta-createbucketpolicy" || echo "Could not add idp - probably already defined"
        /mc idp openid add myminio cryptomatorvaults \
          config_url="${HUB_KEYCLOAK_URL}${HUB_KEYCLOAK_BASEPATH}/realms/${HUB_KEYCLOAK_REALM}/.well-known/openid-configuration" \
          client_id="cryptomatorvaults" \
          client_secret="ignore-me" \
          role_policy="katta-accessbucketpolicy" || echo "Could not add idp - probably already defined"

        # see https://github.com/bitnami/charts/pull/28118
        /mc admin service restart myminio --wait --json
        # sleep necessary despite --wait...
        sleep 5

        /mc idp openid ls myminio
        /mc idp openid info myminio

        # Policies for users with static access credentials, ready to attach when such a user is added.
        /mc admin policy create myminio katta-staticaccessbucketpolicy /setup/minio_static/access_bucket_policy.json
        /mc admin policy create myminio katta-staticcreatebucketpolicy /setup/minio_static/create_bucket_policy.json

  minio_trace:
    profiles: [ local, demo ]
    build:
      context: ./minio-setup
    depends_on:
      minio_setup:
        # restarts during minio setup!
        condition: service_completed_successfully
    entrypoint: [ "/bin/bash","-c" ]
    command:
      - |
        set -euxo pipefail
        /mc alias set myminio ${MINIO_SCHEME}://minio:${MINIO_PORT} minioadmin minioadmin
        /mc admin trace -v myminio

  hub:
    profiles: [ local, demo, hybrid ]
    build:
      context: ./hub
      args:
        KATTA_SERVER_IMAGE: "${KATTA_SERVER_IMAGE:-ghcr.io/shift7-ch/katta-server:latest}"
    depends_on:
      keycloak-ready:
        condition: service_completed_successfully
      keycloak-allow-http:
        condition: service_completed_successfully
        required: false
      postgres:
        condition: service_healthy
      minio_setup:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: [ "CMD-SHELL", "curl -v --fail ${HUB_URL}/api/config" ]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      QUARKUS_PROFILE: dev
      QUARKUS_HTTP_PORT: ${HUB_PORT}
      QUARKUS_OIDC_AUTH_SERVER_URL: ${HUB_KEYCLOAK_URL}${HUB_KEYCLOAK_BASEPATH}/realms/${HUB_KEYCLOAK_REALM}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/quarkus
      QUARKUS_DATASOURCE_USERNAME: quarkus
      QUARKUS_DATASOURCE_PASSWORD: quarkus
      QUARKUS_LOG_LEVEL: DEBUG
      # CSP_CONNECT_SRC_EXTRA holds the S3 and STS endpoints of storage profiles the browser talks to
      # directly, e.g. CSP_CONNECT_SRC_EXTRA="https://*.wasabisys.com". Values are CSP source expressions
      # used verbatim, so a host wildcard covers both path-style and virtual-hosted-style requests.
      QUARKUS_HTTP_HEADER__CONTENT_SECURITY_POLICY__VALUE: "default-src 'self'; connect-src 'self' api.katta.cloud ${MINIO_HOSTNAME}:${MINIO_PORT} ${HUB_KEYCLOAK_URL} ${CSP_CONNECT_SRC_EXTRA:-}; object-src 'none'; child-src 'self'; img-src * data:; frame-ancestors 'none'"
      QUARKUS_SWAGGER_UI_ALWAYS_INCLUDE: true
      QUARKUS_SWAGGER_UI_ENABLE: true
      QUARKUS_SWAGGER_UI_OAUTH_USE_PKCE_WITH_AUTHORIZATION_CODE_GRANT: true
      QUARKUS_SWAGGER_UI_TITLE: Katta Server API
      QUARKUS_SWAGGER_UI_PREAUTHORIZE_BASIC_USERNAME: admin
      QUARKUS_SWAGGER_UI_PREAUTHORIZE_BASIC_PASSWORD: admin

      HUB_KEYCLOAK_PUBLIC_URL: ${HUB_KEYCLOAK_URL}${HUB_KEYCLOAK_BASEPATH}
      HUB_KEYCLOAK_LOCAL_URL: ${HUB_KEYCLOAK_URL}${HUB_KEYCLOAK_BASEPATH}
      HUB_KEYCLOAK_REALM: ${HUB_KEYCLOAK_REALM}
      HUB_KEYCLOAK_SYSTEM_CLIENT_ID: cryptomatorhub-system
      HUB_KEYCLOAK_SYSTEM_CLIENT_SECRET: ${HUB_KEYCLOAK_SYSTEM_CLIENT_SECRET}
      HUB_KEYCLOAK_OIDC_CRYPTOMATOR_CLIENT_ID: cryptomator
      HUB_KEYCLOAK_OIDC_CRYPTOMATOR_VAULTS_CLIENT_SECRET: ${HUB_KEYCLOAK_OIDC_CRYPTOMATOR_VAULTS_CLIENT_SECRET}
      AWS_REGION: us-east-1
      MINIO_SCHEME: ${MINIO_SCHEME}
      MINIO_HOSTNAME: ${MINIO_HOSTNAME}
      MINIO_PORT: ${MINIO_PORT}
      HUB_INITIAL_ID: ${HUB_INITIAL_ID}
      HUB_INITIAL_LICENSE: ${HUB_INITIAL_LICENSE}
      HUB_LICENSE_CHAIN_REQUIRED_CN: "Hub License Issuer CA (Test)"
    networks:
      default:
        # HUB_URL resolves to this container inside the Docker network
        aliases: [ hub.localhost ]
    ports:
      - "${HUB_PORT}:${HUB_PORT}"
    entrypoint: [ "/work/application" ]

  hub_setup_storage_profile:
    profiles: [ demo ]
    # Image of the Katta Admin CLI with a shell, so that the access token can be passed to the
    # storage profile commands.
    image: ghcr.io/shift7-ch/katta-admin-cli:shell
    depends_on:
      keycloak-ready:
        condition: service_completed_successfully
      hub:
        condition: service_healthy
    # busybox shell of the image variant with a shell
    entrypoint: [ "/busybox/sh","-c" ]
    command:
      - |
        set -euxo pipefail

        # service account of client cryptomatorhub-system with realm role admin
        # separate assignment so that set -e catches a failing katta accesstoken
        ACCESS_TOKEN=$$(katta accesstoken \
          --tokenUrl ${HUB_KEYCLOAK_URL}${HUB_KEYCLOAK_BASEPATH}/realms/${HUB_KEYCLOAK_REALM}/protocol/openid-connect/token \
          --clientId cryptomatorhub-system \
          --clientSecret ${HUB_KEYCLOAK_SYSTEM_CLIENT_SECRET})
        export ACCESS_TOKEN

        # MinIO Storage Profiles
        katta storageprofile minio sts \
          --hubUrl ${HUB_URL} --accessToken $$ACCESS_TOKEN \
          --name "MinIO S3 STS" \
          --endpointUrl ${MINIO_SCHEME}://${MINIO_HOSTNAME}:${MINIO_PORT} \
          --region eu-central-1 \
          --regions eu-west-1 --regions eu-west-2 --regions eu-west-3 --regions eu-north-1 \
          --regions eu-south-1 --regions eu-south-2 --regions eu-central-1 --regions eu-central-2 \
          --stsRoleCreateBucketClient arn:minio:iam:::role/IqZpDC5ahW_DCAvZPZA4ACjEnDE \
          --stsRoleCreateBucketHub arn:minio:iam:::role/HGKdlY4eFFsXVvJmwlMYMhmbnDE \
          --stsRoleAccessBucket arn:minio:iam:::role/Hdms6XDZ6oOpuWYI3gu4gmgHN94 \
          --skipIfExists

        katta storageprofile s3 static \
          --hubUrl ${HUB_URL} --accessToken $$ACCESS_TOKEN \
          --name "MinIO S3 static" \
          --endpointUrl ${MINIO_SCHEME}://${MINIO_HOSTNAME}:${MINIO_PORT} \
          --region eu-central-1 \
          --skipIfExists

  # last service(s) must not exit for up --wait to succeed...
  wait:
    profiles: [ local, demo ]
    image: alpine/curl:8.22.0
    entrypoint: [ "sleep" ]
    command: [ "infinity" ]
    depends_on:
      minio_trace:
        condition: service_started

  # last service(s) must not exit for up --wait to succeed...
  wait_demo:
    profiles: [ demo ]
    image: alpine/curl:8.22.0
    entrypoint: [ "sleep" ]
    command: [ "infinity" ]
    depends_on:
      hub_setup_storage_profile:
        condition: service_completed_successfully

volumes:
  keycloak-import:
